[build-system]
requires = ["setuptools==80.10.2", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "metor"
dynamic = ["version", "dependencies"]
description = "A Tor Messenger Framework."
readme = "README.md"
authors = [{ name = "LuRex" }]
requires-python = ">=3.11"
license = { text = "GPLv3" }

[project.optional-dependencies]
dev = ["ruff==0.15.8", "mypy==1.19.1"]

[project.scripts]
metor = "metor.main:main"
metor-daemon = "metor.daemon_main:main"

[tool.setuptools]
include-package-data = true
py-modules = [
    "metor.__main__",
    "metor.main",
    "metor.daemon_main",
    "metor.core.key",
    "metor.core.profile_destruction",
    "metor.core.profile_keys",
    "metor.core.tor",
]

[tool.setuptools.dynamic]
version = { attr = "metor.versioning.APP_VERSION" }

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "metor.application",
    "metor.application.*",
    "metor.cli",
    "metor.cli.*",
    "metor.core.daemon",
    "metor.core.daemon.*",
    "metor.data",
    "metor.data.*",
    "metor.utils",
    "metor.utils.*",
]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "psutil",
    "sqlcipher3",
    "sqlcipher3.*",
    "pysqlcipher3",
    "pysqlcipher3.*",
    "socks",
    "stem",
    "stem.*",
]
ignore_missing_imports = true
