name: Provision native Tor
description: Installs a native Tor executable for real managed-daemon acceptance.

runs:
  using: composite
  steps:
    - name: Install Tor on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends tor
        test -x /usr/bin/tor

    - name: Install verified Tor Expert Bundle on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $version = '15.0.23'
        $archiveName = "tor-expert-bundle-windows-x86_64-$version.tar.gz"
        $archive = Join-Path $env:RUNNER_TEMP $archiveName
        $destination = Join-Path $env:RUNNER_TEMP 'metor-native-tor'
        Invoke-WebRequest "https://dist.torproject.org/torbrowser/$version/$archiveName" -OutFile $archive
        $expected = '231dad6b9cb401a54c260db7046965ef04e4f72ff071b140d423fb5da281ab1e'
        $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
        if ($actual -ne $expected) {
          throw "Tor Expert Bundle checksum mismatch: $actual"
        }
        New-Item -ItemType Directory -Force $destination | Out-Null
        tar -xf $archive -C $destination
        $tor = Get-ChildItem $destination -Filter 'tor.exe' -File -Recurse | Select-Object -First 1
        if ($null -eq $tor) {
          throw 'Tor Expert Bundle did not contain tor.exe.'
        }
        "METOR_TOR_PATH=$($tor.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
