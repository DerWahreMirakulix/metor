name: "Python Quality"
description: "Set up Python, install dependencies, and run shared quality checks."

inputs:
  python-version:
    description: Python version to install.
    required: false
    default: "3.11"
  pip-version:
    description: Pip version to install before dependency setup.
    required: false
    default: "26.0.1"
  ruff-check-paths:
    description: Space-delimited paths for ruff check.
    required: false
    default: "src/metor/ scripts/"
  ruff-format-paths:
    description: Space-delimited paths for ruff format --check.
    required: false
    default: "src/metor/ scripts/"
  mypy-paths:
    description: Space-delimited paths for mypy.
    required: false
    default: "src/metor/ scripts/"
  run-tests:
    description: Whether to execute the configured test command.
    required: false
    default: "false"
  test-command:
    description: Shell command used to execute the test suite.
    required: false
    default: "python -m unittest discover -s tests -p 'test_*.py'"

runs:
  using: composite
  steps:
    - name: Set up pinned documentation tooling
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: "22.17.1"
        cache: npm

    - name: Install pinned documentation tooling
      shell: bash
      run: npm ci

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip

    - name: Install Project and Dev Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade "pip==${{ inputs.pip-version }}"
        python -m pip install -r requirements/dev.txt
        python -m pip check
        python scripts/check_boundaries.py

    - name: Run Ruff (Linting)
      shell: bash
      run: |
        ruff check ${{ inputs.ruff-check-paths }}

    - name: Run Ruff (Formatting Check)
      shell: bash
      run: |
        ruff format --check ${{ inputs.ruff-format-paths }}

    - name: Run Mypy (Static Type Checking)
      shell: bash
      run: |
        mypy ${{ inputs.mypy-paths }}

    - name: Run Tests
      if: ${{ inputs.run-tests == 'true' }}
      shell: bash
      run: |
        test_log="${RUNNER_TEMP}/metor-unittest.log"
        set +e
        ${{ inputs.test-command }} 2>&1 | tee "${test_log}"
        test_status=${PIPESTATUS[0]}
        set -e
        if (( test_status != 0 )); then
          test_summary="$(tail -c 4096 "${test_log}")"
          test_summary="${test_summary//"${GITHUB_WORKSPACE}"/'<redacted>'}"
          test_summary="${test_summary//"${RUNNER_TEMP}"/'<redacted>'}"
          test_summary="${test_summary//"${HOME}"/'<redacted>'}"
          test_summary="${test_summary//'%'/'%25'}"
          test_summary="${test_summary//$'\r'/'%0D'}"
          test_summary="${test_summary//$'\n'/'%0A'}"
          echo "::error title=Python quality tests failed::${test_summary}"
          exit "${test_status}"
        fi
