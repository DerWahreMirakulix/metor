name: "Python Quality"
description: "Set up Python, install dependencies, and run shared quality checks."

inputs:
  python-version:
    description: Python version to install.
    required: false
    default: "3.11"
  pip-version:
    description: Pip version to install before dependency setup.
    required: false
    default: "26.0.1"
  ruff-check-paths:
    description: Space-delimited paths for ruff check.
    required: false
    default: "src/metor/ scripts/"
  ruff-format-paths:
    description: Space-delimited paths for ruff format --check.
    required: false
    default: "src/metor/ scripts/"
  mypy-paths:
    description: Space-delimited paths for mypy.
    required: false
    default: "src/metor/ scripts/"
  run-tests:
    description: Whether to execute the configured test command.
    required: false
    default: "false"
  test-command:
    description: Shell command used to execute the test suite.
    required: false
    default: "python scripts/run_tests.py --suite all"

runs:
  using: composite
  steps:
    - name: Set up pinned documentation tooling
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: "22.17.1"
        cache: npm

    - name: Install pinned documentation tooling
      shell: bash
      run: npm ci

    - name: Check Markdown formatting
      shell: bash
      run: npm run check:md

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip

    - name: Install Project and Dev Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade "pip==${{ inputs.pip-version }}"
        python -m pip install -r requirements/dev.txt
        python -m pip check
        python scripts/check_boundaries.py

    - name: Verify test progress record
      if: ${{ inputs.run-tests == 'true' }}
      shell: bash
      run: python scripts/run_tests.py --suite fast --module test_run_tests --match test_progress_record --failfast

    - name: Run Ruff (Linting)
      shell: bash
      run: |
        ruff check ${{ inputs.ruff-check-paths }}

    - name: Run Ruff (Formatting Check)
      shell: bash
      run: |
        ruff format --check ${{ inputs.ruff-format-paths }}

    - name: Run Mypy (Static Type Checking)
      shell: bash
      run: |
        mypy ${{ inputs.mypy-paths }}

    - name: Run Tests
      if: ${{ inputs.run-tests == 'true' }}
      shell: bash
      run: |
        set +e
        ${{ inputs.test-command }}
        test_status=$?
        if (( test_status != 0 )); then
          echo '::error title=Python quality tests failed::See the bounded unittest report artifact.'
          exit "${test_status}"
        fi
        set -e
