name: Generate Documentation

permissions: {}

concurrency:
  group: metor-generated-docs-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    paths:
      - "src/metor/core/api/**"
      - "src/metor/data/settings.py"
      - "src/metor/data/profile/models.py"
      - "scripts/generate_api_docs.py"
      - "scripts/generate_compatibility_manifest.py"
      - "scripts/validate_generated_docs.py"
      - "scripts/release/**"
      - "src/metor/versioning/**"
      - "src/metor/core/daemon/managed/models.py"
      - "src/metor/core/daemon/managed/network/handshake.py"
      - "src/metor/data/sql/schema.py"
      - "src/metor/core/profile_keys.py"
      - "src/metor/data/blob/store.py"
      - "scripts/generate_settings_docs.py"
      - ".github/workflows/generate_api_docs.yml"
      - "pyproject.toml"
      - "requirements/**"
      - "package.json"
      - "package-lock.json"

jobs:
  build-and-commit-docs:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Fetch the full history so the bot can push back to the branch cleanly
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Run Shared Python Quality Checks
        uses: ./.github/actions/python-quality
        with:
          python-version: "3.11"
          ruff-check-paths: "src/metor/ scripts/"
          ruff-format-paths: "src/metor/ scripts/"
          mypy-paths: "src/metor/ scripts/"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.17.1"
          cache: "npm"

      - name: Install NPM Dependencies
        run: npm ci

      - name: Execute Documentation Generators
        run: npm run generate:docs

      - name: Validate generated documentation determinism
        run: python scripts/validate_generated_docs.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add docs/generated/API.md docs/generated/SETTINGS.md docs/generated/api.schema.json docs/generated/compatibility.json

          # Evaluate diff; commit and push only if the generation resulted in changes
          if ! git diff --cached --quiet; then
            git commit -m "docs: auto-update generated documentation"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
