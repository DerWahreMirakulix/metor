name: Release Metor

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Application SemVer bump (use current only for the first release)
        required: true
        type: choice
        default: patch
        options:
          - current
          - patch
          - minor
          - major
      dry_run:
        description: Validate and build without committing, tagging, or publishing
        required: true
        type: boolean
        default: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      latest_tag: ${{ steps.version.outputs.latest_tag }}
      next_version: ${{ steps.version.outputs.next_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Reject non-main publish requests
        shell: bash
        run: |
          if [[ '${{ inputs.dry_run }}' == 'false' && "$GITHUB_REF_NAME" != 'main' ]]; then
            echo 'Public releases may only be published from main.' >&2
            exit 1
          fi

      - name: Calculate application version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tags="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.draft | not) | .tag_name')"
          baseline_args=()
          while IFS= read -r release_tag; do
            if [[ -n "$release_tag" ]]; then
              baseline_args+=(--available-release "$release_tag")
            fi
          done <<< "$release_tags"
          latest_tag="$(python scripts/calculate_release_version.py --select-baseline "${baseline_args[@]}")"
          args=(--release-type '${{ inputs.release_type }}')
          if [ -n "$latest_tag" ]; then
            args+=(--previous-release "$latest_tag")
          fi
          next_version="$(python scripts/calculate_release_version.py "${args[@]}")"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "next_version=$next_version" >> "$GITHUB_OUTPUT"
          echo "Candidate release: v$next_version"

  quality:
    needs: prepare
    name: Release Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply candidate application version
        shell: bash
        run: python scripts/versioning.py set-app '${{ needs.prepare.outputs.next_version }}'

      - name: Run Linux and Windows quality gates
        uses: ./.github/actions/python-quality
        with:
          python-version: "3.11"
          ruff-check-paths: "src/metor/ scripts/ tests/"
          ruff-format-paths: "src/metor/ scripts/ tests/"
          mypy-paths: "src/metor/ scripts/"
          run-tests: "true"

      - name: Set up Node.js for documentation generators
        uses: actions/setup-node@v6
        with:
          node-version: "22.17.1"
          cache: "npm"

      - name: Install pinned documentation tooling
        shell: bash
        run: npm ci

      - name: Generate and validate release documentation
        shell: bash
        run: |
          python scripts/validate_generated_docs.py
          python scripts/versioning.py validate

      - name: Load previous public compatibility baseline
        if: needs.prepare.outputs.latest_tag != ''
        shell: bash
        run: git show '${{ needs.prepare.outputs.latest_tag }}:docs/generated/compatibility.json' > previous-compatibility.json

      - name: Check release compatibility
        shell: bash
        run: |
          args=(--current docs/generated/compatibility.json)
          if [ -n '${{ needs.prepare.outputs.latest_tag }}' ]; then
            args+=(--previous previous-compatibility.json)
          fi
          python scripts/check_release_compatibility.py "${args[@]}"

      - name: Build all package variants
        shell: bash
        run: |
          mkdir -p dist/wheels
          python -m pip wheel --no-deps --no-build-isolation . -w dist/wheels
          python -m pip wheel --no-deps --no-build-isolation packaging/sdk -w dist/wheels
          python -m pip wheel --no-deps --no-build-isolation packaging/terminal -w dist/wheels
          python scripts/validate_wheel_versions.py dist/wheels/*.whl

      - name: Build platform release bundles
        shell: bash
        run: python scripts/build_release_wheelhouse.py --output-dir dist/release --skip-pip-upgrade --variant all

      - name: Smoke-test Linux bundle installers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          extract_dir='dist/release-smoke'

          base_zip="$(find dist/release -maxdepth 1 -type f -name 'metor-wheelhouse-*.zip' | head -n 1)"
          python -m zipfile -e "$base_zip" "$extract_dir/base"
          base_dir="$(find "$extract_dir/base" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          sh "$base_dir/install.sh"
          "$base_dir/.venv/bin/python" -m pip check
          "$base_dir/.venv/bin/python" -c "import metor.daemon_main; from metor.data.sql import SQLCIPHER_BACKEND; print(SQLCIPHER_BACKEND)"
          "$base_dir/.venv/bin/metor" --help
          "$base_dir/.venv/bin/metor-daemon" --help
          "$base_dir/.venv/bin/python" -c "
          try:
            import metor.ui.terminal
            raise SystemExit(1)
          except ModuleNotFoundError:
            pass
          "

          terminal_zip="$(find dist/release -maxdepth 1 -type f -name 'metor-ui-terminal-wheelhouse-*.zip' | head -n 1)"
          python -m zipfile -e "$terminal_zip" "$extract_dir/terminal"
          terminal_dir="$(find "$extract_dir/terminal" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          sh "$terminal_dir/install.sh"
          "$terminal_dir/.venv/bin/python" -m pip check
          "$terminal_dir/.venv/bin/python" -c "import metor.ui.terminal"
          "$terminal_dir/.venv/bin/metor" chat --list-uis

          sdk_zip="$(find dist/release -maxdepth 1 -type f -name 'metor-sdk-wheelhouse-*.zip' | head -n 1)"
          python -m zipfile -e "$sdk_zip" "$extract_dir/sdk"
          sdk_dir="$(find "$extract_dir/sdk" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          sh "$sdk_dir/install.sh"
          "$sdk_dir/.venv/bin/python" -m pip check
          "$sdk_dir/.venv/bin/python" -c "from metor.client import MetorClient; print(MetorClient)"
          "$sdk_dir/.venv/bin/python" -c "
          try:
            import sqlcipher3
            raise SystemExit(1)
          except ModuleNotFoundError:
            pass
          "
          "$sdk_dir/.venv/bin/python" -c "
          try:
            import metor.data
            raise SystemExit(1)
          except ModuleNotFoundError:
            pass
          "

      - name: Smoke-test Windows bundle installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $extractDir = Join-Path $PWD 'dist/release-smoke'

          $baseZip = (Get-ChildItem 'dist/release' -Filter 'metor-wheelhouse-*.zip' | Select-Object -First 1).FullName
          python -m zipfile -e $baseZip (Join-Path $extractDir 'base')
          $baseDir = (Get-ChildItem (Join-Path $extractDir 'base') -Directory | Select-Object -First 1).FullName
          & "$baseDir\install.cmd"
          & "$baseDir\.venv\Scripts\python.exe" -m pip check
          & "$baseDir\.venv\Scripts\python.exe" -c "import metor.daemon_main; from metor.data.sql import SQLCIPHER_BACKEND; print(SQLCIPHER_BACKEND)"
          & "$baseDir\.venv\Scripts\metor.exe" --help
          & "$baseDir\.venv\Scripts\metor-daemon.exe" --help
          & "$baseDir\.venv\Scripts\python.exe" -c "try:`n    import metor.ui.terminal`n    raise SystemExit(1)`nexcept ModuleNotFoundError:`n    pass"

          $terminalZip = (Get-ChildItem 'dist/release' -Filter 'metor-ui-terminal-wheelhouse-*.zip' | Select-Object -First 1).FullName
          python -m zipfile -e $terminalZip (Join-Path $extractDir 'terminal')
          $terminalDir = (Get-ChildItem (Join-Path $extractDir 'terminal') -Directory | Select-Object -First 1).FullName
          & "$terminalDir\install.cmd"
          & "$terminalDir\.venv\Scripts\python.exe" -m pip check
          & "$terminalDir\.venv\Scripts\python.exe" -c "import metor.ui.terminal"
          & "$terminalDir\.venv\Scripts\metor.exe" chat --list-uis

          $sdkZip = (Get-ChildItem 'dist/release' -Filter 'metor-sdk-wheelhouse-*.zip' | Select-Object -First 1).FullName
          python -m zipfile -e $sdkZip (Join-Path $extractDir 'sdk')
          $sdkDir = (Get-ChildItem (Join-Path $extractDir 'sdk') -Directory | Select-Object -First 1).FullName
          & "$sdkDir\install.cmd"
          & "$sdkDir\.venv\Scripts\python.exe" -m pip check
          & "$sdkDir\.venv\Scripts\python.exe" -c "from metor.client import MetorClient; print(MetorClient)"
          & "$sdkDir\.venv\Scripts\python.exe" -c "try:`n    import sqlcipher3`n    raise SystemExit(1)`nexcept ModuleNotFoundError:`n    pass"
          & "$sdkDir\.venv\Scripts\python.exe" -c "try:`n    import metor.data`n    raise SystemExit(1)`nexcept ModuleNotFoundError:`n    pass"

      - name: Preserve platform release bundles
        uses: actions/upload-artifact@v4
        with:
          name: metor-release-bundles-${{ matrix.os }}
          path: dist/release/*.zip
          if-no-files-found: error

      - name: Preserve generated release baseline
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: release-compatibility-baseline
          path: |
            docs/generated/API.md
            docs/generated/SETTINGS.md
            docs/generated/api.schema.json
            docs/generated/compatibility.json
          if-no-files-found: error

  publish:
    needs:
      - prepare
      - quality
    runs-on: ubuntu-latest
    if: inputs.dry_run == false && github.ref_name == 'main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-compatibility-baseline
          path: release-state

      - uses: actions/download-artifact@v4
        with:
          pattern: metor-release-bundles-*
          path: dist/release-assets
          merge-multiple: true

      - name: Create release commit and tag
        shell: bash
        run: |
          python scripts/versioning.py set-app '${{ needs.prepare.outputs.next_version }}'
          cp release-state/API.md docs/generated/API.md
          cp release-state/SETTINGS.md docs/generated/SETTINGS.md
          cp release-state/api.schema.json docs/generated/api.schema.json
          cp release-state/compatibility.json docs/generated/compatibility.json
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add src/metor/versioning/__init__.py docs/generated/API.md docs/generated/SETTINGS.md docs/generated/api.schema.json docs/generated/compatibility.json
          if ! git diff --cached --quiet; then
            git commit -m 'release: v${{ needs.prepare.outputs.next_version }}'
          fi
          git tag -a 'v${{ needs.prepare.outputs.next_version }}' -m 'Metor v${{ needs.prepare.outputs.next_version }}'
          git push origin HEAD:${GITHUB_REF_NAME} 'refs/tags/v${{ needs.prepare.outputs.next_version }}'

      - name: Publish GitHub release with compatibility matrix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Compatibility matrix'
            echo
            echo '```text'
            python scripts/versioning.py status
            echo '```'
          } > release-notes.md
          gh release create 'v${{ needs.prepare.outputs.next_version }}' --verify-tag --generate-notes --notes-file release-notes.md
          while IFS= read -r -d '' archive_path; do
            gh release upload 'v${{ needs.prepare.outputs.next_version }}' "$archive_path"
          done < <(find dist/release-assets -type f -name '*.zip' -print0)

  dry-run-result:
    needs:
      - prepare
      - quality
    runs-on: ubuntu-latest
    if: inputs.dry_run == true
    steps:
      - run: echo 'Dry run passed for v${{ needs.prepare.outputs.next_version }}; no repository or release state was changed.'
