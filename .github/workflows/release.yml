name: Release Metor

permissions: {}

concurrency:
  group: metor-release
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Application SemVer bump (use current only for the first release)
        required: true
        type: choice
        default: patch
        options:
          - current
          - patch
          - minor
          - major
      dry_run:
        description: Validate and build without committing, tagging, or publishing
        required: true
        type: boolean
        default: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
      latest_tag: ${{ steps.version.outputs.latest_tag }}
      next_version: ${{ steps.version.outputs.next_version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Record immutable candidate
        id: candidate
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Reject non-main publish requests
        shell: bash
        run: |
          if [[ '${{ inputs.dry_run }}' == 'false' && "$GITHUB_REF_NAME" != 'main' ]]; then
            echo 'Public releases may only be published from main.' >&2
            exit 1
          fi

      - name: Calculate application version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tags="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.draft | not) | .tag_name')"
          baseline_args=()
          while IFS= read -r release_tag; do
            if [[ -n "$release_tag" ]]; then
              baseline_args+=(--available-release "$release_tag")
            fi
          done <<< "$release_tags"
          latest_tag="$(python scripts/calculate_release_version.py --select-baseline "${baseline_args[@]}")"
          args=(--release-type '${{ inputs.release_type }}')
          if [ -n "$latest_tag" ]; then
            args+=(--previous-release "$latest_tag")
          fi
          next_version="$(python scripts/calculate_release_version.py "${args[@]}")"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "next_version=$next_version" >> "$GITHUB_OUTPUT"
          echo "Candidate release: v$next_version"
          if git ls-remote --exit-code --tags origin "refs/tags/v$next_version" >/dev/null 2>&1; then
            echo "Release tag v$next_version already exists." >&2
            exit 1
          fi

  quality:
    needs: prepare
    name: Release Quality (${{ matrix.os }})
    timeout-minutes: 120
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.candidate_sha }}

      - name: Apply candidate application version
        shell: bash
        run: python scripts/versioning.py set-app '${{ needs.prepare.outputs.next_version }}'

      - name: Run Linux and Windows quality gates
        uses: ./.github/actions/python-quality
        with:
          python-version: "3.11"
          ruff-check-paths: "src/metor/ scripts/ tests/"
          ruff-format-paths: "src/metor/ scripts/ tests/"
          mypy-paths: "src/metor/ scripts/"

      - name: Generate and validate release documentation
        shell: bash
        run: |
          npm run generate:docs
          python scripts/validate_generated_docs.py
          python scripts/versioning.py validate

      - name: Run candidate test suite
        shell: bash
        run: python scripts/run_tests.py --suite all

      - name: Load previous public compatibility baseline
        if: needs.prepare.outputs.latest_tag != ''
        shell: bash
        run: git show '${{ needs.prepare.outputs.latest_tag }}:docs/generated/compatibility.json' > previous-compatibility.json

      - name: Check release compatibility
        shell: bash
        run: |
          args=(--current docs/generated/compatibility.json)
          if [ -n '${{ needs.prepare.outputs.latest_tag }}' ]; then
            args+=(--previous previous-compatibility.json)
          fi
          python scripts/check_release_compatibility.py "${args[@]}"

      - name: Build platform release bundles
        shell: bash
        run: python scripts/build_release_wheelhouse.py --output-dir dist/release --skip-pip-upgrade --variant all

      - name: Validate coordinated wheels in the release bundles
        shell: bash
        run: |
          python scripts/validate_wheel_versions.py \
            dist/release/metor-wheelhouse-*/wheelhouse/metor-*.whl \
            dist/release/metor-sdk-wheelhouse-*/wheelhouse/metor_sdk-*.whl \
            dist/release/metor-ui-terminal-wheelhouse-*/wheelhouse/metor_ui_terminal-*.whl \
            dist/release/metor-ui-gui-wheelhouse-*/wheelhouse/metor_ui_gui-*.whl

      - name: Provision a generic Linux GUI display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends xvfb xauth libxtst6 libegl1 libegl-mesa0 libgl1-mesa-dri dbus-daemon dbus-x11 at-spi2-core python3-gi
          python -c "import ctypes; ctypes.CDLL('libEGL.so.1')"

      - name: Validate installed consumers and native GUI on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          KIVY_WINDOW: sdl2
          KIVY_CLIPBOARD: dummy
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_VIDEODRIVER: x11
        run: xvfb-run -a --server-args='-screen 0 1280x1024x24' python scripts/validate_installed_artifacts.py dist/release --gui-smoke

      - name: Validate installed consumers on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/validate_installed_artifacts.py dist/release --gui-smoke --windows-launch

      - name: Validate every native installer
        shell: bash
        run: python scripts/validate_release_installers.py dist/release

      - name: Accept native GUI behavior from the release candidate
        if: runner.os == 'Linux'
        uses: ./.github/actions/gui-acceptance
        with:
          revision: ${{ needs.prepare.outputs.candidate_sha }}
          artifact-name: release-gui-native-evidence-linux-py311

      - name: Preserve platform release bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: metor-release-bundles-${{ matrix.os }}
          path: dist/release/*.zip
          if-no-files-found: error

      - name: Preserve generated release baseline
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-compatibility-baseline
          path: |
            docs/generated/API.md
            docs/generated/SETTINGS.md
            docs/generated/api.schema.json
            docs/generated/compatibility.json
          if-no-files-found: error

  publish:
    needs:
      - prepare
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: inputs.dry_run == false && github.ref_name == 'main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.candidate_sha }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-compatibility-baseline
          path: release-state

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: metor-release-bundles-*
          path: dist/release-assets
          merge-multiple: true

      - name: Create release commit and tag
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [ "$(git rev-parse refs/remotes/origin/main)" != '${{ needs.prepare.outputs.candidate_sha }}' ]; then
            echo 'main moved after release validation; restart from the new commit.' >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin 'refs/tags/v${{ needs.prepare.outputs.next_version }}' >/dev/null 2>&1; then
            echo 'Release tag already exists.' >&2
            exit 1
          fi
          python scripts/versioning.py set-app '${{ needs.prepare.outputs.next_version }}'
          cp release-state/API.md docs/generated/API.md
          cp release-state/SETTINGS.md docs/generated/SETTINGS.md
          cp release-state/api.schema.json docs/generated/api.schema.json
          cp release-state/compatibility.json docs/generated/compatibility.json
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add src/metor/versioning/__init__.py docs/generated/API.md docs/generated/SETTINGS.md docs/generated/api.schema.json docs/generated/compatibility.json
          if ! git diff --cached --quiet; then
            git commit -m 'release: v${{ needs.prepare.outputs.next_version }}'
          fi
          git tag -a 'v${{ needs.prepare.outputs.next_version }}' -m 'Metor v${{ needs.prepare.outputs.next_version }}'
          python -m scripts.release.refs --remote origin --branch main --tag 'v${{ needs.prepare.outputs.next_version }}'

      - name: Publish GitHub release with compatibility matrix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Compatibility matrix'
            echo
            echo '```text'
            python scripts/versioning.py status
            echo '```'
          } > release-notes.md
          gh release create 'v${{ needs.prepare.outputs.next_version }}' --verify-tag --generate-notes --notes-file release-notes.md
          while IFS= read -r -d '' archive_path; do
            gh release upload 'v${{ needs.prepare.outputs.next_version }}' "$archive_path"
          done < <(find dist/release-assets -type f -name '*.zip' -print0)

  dry-run-result:
    needs:
      - prepare
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: inputs.dry_run == true
    permissions: {}
    steps:
      - run: echo 'Dry run passed for v${{ needs.prepare.outputs.next_version }}; no repository or release state was changed.'
