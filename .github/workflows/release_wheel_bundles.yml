name: Release Wheel Bundles

"on":
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-wheel-bundles:
    name: Build Wheel Bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Build Tools
        shell: bash
        run: |
          python -m pip install --upgrade pip==26.0.1
          pip install setuptools==80.10.2 wheel==0.46.3

      - name: Build Release Wheel Bundles
        shell: bash
        run: python scripts/build_release_wheelhouse.py --output-dir dist/release --skip-pip-upgrade --variant all

      - name: Smoke-Test Linux Bundle Installers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          extract_dir='dist/release-smoke'

          # 1. Full bundle (metor)
          full_zip="$(find dist/release -maxdepth 1 -type f -name 'metor-wheelhouse-*.zip' ! -name 'metor-daemon*' ! -name 'metor-sdk*' | head -n 1)"
          python -m zipfile -e "$full_zip" "$extract_dir/full"
          full_dir="$(find "$extract_dir/full" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          sh "$full_dir/install.sh"
          "$full_dir/.venv/bin/python" -m pip check
          "$full_dir/.venv/bin/python" -c "import metor; from metor.data.sql import SQLCIPHER_BACKEND; print(SQLCIPHER_BACKEND)"
          "$full_dir/.venv/bin/metor" --help

          # 2. Daemon bundle (metor-daemon)
          daemon_zip="$(find dist/release -maxdepth 1 -type f -name 'metor-daemon-wheelhouse-*.zip' | head -n 1)"
          python -m zipfile -e "$daemon_zip" "$extract_dir/daemon"
          daemon_dir="$(find "$extract_dir/daemon" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          sh "$daemon_dir/install.sh"
          "$daemon_dir/.venv/bin/python" -m pip check
          "$daemon_dir/.venv/bin/python" -c "import metor.daemon_main; from metor.data.sql import SQLCIPHER_BACKEND; print(SQLCIPHER_BACKEND)"
          "$daemon_dir/.venv/bin/metor-daemon" --help
          "$daemon_dir/.venv/bin/python" -c "
          try:
              import metor.ui
              raise SystemExit(1)
          except ModuleNotFoundError:
              pass
          "

          # 3. SDK bundle (metor-sdk)
          sdk_zip="$(find dist/release -maxdepth 1 -type f -name 'metor-sdk-wheelhouse-*.zip' | head -n 1)"
          python -m zipfile -e "$sdk_zip" "$extract_dir/sdk"
          sdk_dir="$(find "$extract_dir/sdk" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          sh "$sdk_dir/install.sh"
          "$sdk_dir/.venv/bin/python" -m pip check
          "$sdk_dir/.venv/bin/python" -c "from metor.client import MetorClient; print(MetorClient)"
          "$sdk_dir/.venv/bin/python" -c "
          try:
              import sqlcipher3
              raise SystemExit(1)
          except ModuleNotFoundError:
              pass
          "
          "$sdk_dir/.venv/bin/python" -c "
          try:
              import metor.data
              raise SystemExit(1)
          except ModuleNotFoundError:
              pass
          "

      - name: Smoke-Test Windows Bundle Installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $extractDir = Join-Path $PWD 'dist/release-smoke'

          # 1. Full bundle
          $fullZip = (Get-ChildItem 'dist/release' -Filter 'metor-wheelhouse-*.zip' | Where-Object { $_.Name -notlike 'metor-daemon*' -and $_.Name -notlike 'metor-sdk*' } | Select-Object -First 1).FullName
          python -m zipfile -e $fullZip (Join-Path $extractDir 'full')
          $fullDir = (Get-ChildItem (Join-Path $extractDir 'full') -Directory | Select-Object -First 1).FullName
          & "$fullDir\install.cmd"
          & "$fullDir\.venv\Scripts\python.exe" -m pip check
          & "$fullDir\.venv\Scripts\python.exe" -c "import metor; from metor.data.sql import SQLCIPHER_BACKEND; print(SQLCIPHER_BACKEND)"
          & "$fullDir\.venv\Scripts\metor.exe" --help

          # 2. Daemon bundle
          $daemonZip = (Get-ChildItem 'dist/release' -Filter 'metor-daemon-wheelhouse-*.zip' | Select-Object -First 1).FullName
          python -m zipfile -e $daemonZip (Join-Path $extractDir 'daemon')
          $daemonDir = (Get-ChildItem (Join-Path $extractDir 'daemon') -Directory | Select-Object -First 1).FullName
          & "$daemonDir\install.cmd"
          & "$daemonDir\.venv\Scripts\python.exe" -m pip check
          & "$daemonDir\.venv\Scripts\python.exe" -c "import metor.daemon_main; from metor.data.sql import SQLCIPHER_BACKEND; print(SQLCIPHER_BACKEND)"
          & "$daemonDir\.venv\Scripts\metor-daemon.exe" --help
          & "$daemonDir\.venv\Scripts\python.exe" -c "try:`n    import metor.ui`n    raise SystemExit(1)`nexcept ModuleNotFoundError:`n    pass"

          # 3. SDK bundle
          $sdkZip = (Get-ChildItem 'dist/release' -Filter 'metor-sdk-wheelhouse-*.zip' | Select-Object -First 1).FullName
          python -m zipfile -e $sdkZip (Join-Path $extractDir 'sdk')
          $sdkDir = (Get-ChildItem (Join-Path $extractDir 'sdk') -Directory | Select-Object -First 1).FullName
          & "$sdkDir\install.cmd"
          & "$sdkDir\.venv\Scripts\python.exe" -m pip check
          & "$sdkDir\.venv\Scripts\python.exe" -c "from metor.client import MetorClient; print(MetorClient)"
          & "$sdkDir\.venv\Scripts\python.exe" -c "try:`n    import sqlcipher3`n    raise SystemExit(1)`nexcept ModuleNotFoundError:`n    pass"
          & "$sdkDir\.venv\Scripts\python.exe" -c "try:`n    import metor.data`n    raise SystemExit(1)`nexcept ModuleNotFoundError:`n    pass"

      - name: Upload Release Bundle Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: metor-wheel-bundle-${{ matrix.os }}
          path: dist/release/*.zip
          if-no-files-found: error

  publish-release-assets:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-wheel-bundles
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Bundle Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release-artifacts

      - name: Publish Bundles To GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag_name="${GITHUB_REF_NAME}"
          if ! gh release view "$tag_name" >/dev/null 2>&1; then
            gh release create "$tag_name" --verify-tag --generate-notes
          fi
          while IFS= read -r -d '' archive_path; do
            gh release upload "$tag_name" "$archive_path" --clobber
          done < <(find dist/release-artifacts -type f -name '*.zip' -print0)
