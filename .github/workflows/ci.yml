name: CI

permissions: {}

on:
  push:
  pull_request:

jobs:
  python-quality:
    name: Python Quality (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run Shared Python Quality Checks
        uses: ./.github/actions/python-quality
        with:
          python-version: ${{ matrix.python-version }}
          ruff-check-paths: "src/metor/ scripts/ tests/"
          ruff-format-paths: "src/metor/ scripts/ tests/"
          mypy-paths: "src/metor/ scripts/"
          run-tests: "true"

      - name: Build and validate all wheels
        shell: bash
        run: |
          python -m pip wheel --no-deps --no-build-isolation . -w dist
          python -m pip wheel --no-deps --no-build-isolation packaging/sdk -w dist
          python -m pip wheel --no-deps --no-build-isolation packaging/terminal -w dist
          python -m pip wheel --no-deps --no-build-isolation packaging/gui -w dist
          python scripts/validate_wheel_versions.py dist/*.whl

      - name: Validate Central Version Registry
        run: python scripts/versioning.py validate

      - name: Validate generated references against checked-in copies
        run: python scripts/validate_generated_docs.py

      - name: Build native offline bundles
        if: matrix.python-version == '3.11'
        shell: bash
        run: python scripts/build_release_wheelhouse.py --variant all --skip-pip-upgrade --output-dir closure-bundles

      - name: Validate installed consumers
        if: matrix.python-version == '3.11'
        run: python scripts/validate_installed_artifacts.py closure-bundles

      - name: Validate native offline installers
        if: matrix.python-version == '3.11'
        run: python scripts/validate_release_installers.py closure-bundles

      - name: Provision and verify Linux EGL software rendering
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri
          python -c "import ctypes; ctypes.CDLL('libEGL.so.1')"

      - name: Run native GUI fixtures outside unittest discovery
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        shell: bash
        env:
          SDL_VIDEODRIVER: offscreen
          KIVY_WINDOW: sdl2
          KIVY_CLIPBOARD: dummy
        run: |
          set -o pipefail
          python tests/gui_native_capture.py --view root_refresh --width 360 --height 640 --font-scale 1.5 --output "${RUNNER_TEMP}/root-refresh.png" 2>&1 | tee "${RUNNER_TEMP}/root-refresh.log"
          python tests/gui_native_capture.py --view setting_keyboard --width 360 --height 640 --font-scale 1.5 --output "${RUNNER_TEMP}/setting-keyboard.png" 2>&1 | tee "${RUNNER_TEMP}/setting-keyboard.log"

      - name: Run bounded synthetic stream fixture outside unittest discovery
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        shell: bash
        run: |
          set -o pipefail
          python tests/gui_stream_pressure.py --result "${RUNNER_TEMP}/stream-pressure.json" 2>&1 | tee "${RUNNER_TEMP}/stream-pressure.log"

      - name: Upload native GUI and stream evidence
        if: always() && runner.os == 'Linux' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gui-native-evidence-linux-py311
          path: |
            ${{ runner.temp }}/root-refresh.png
            ${{ runner.temp }}/setting-keyboard.png
            ${{ runner.temp }}/root-refresh.log
            ${{ runner.temp }}/setting-keyboard.log
            ${{ runner.temp }}/stream-pressure.json
            ${{ runner.temp }}/stream-pressure.log
          if-no-files-found: warn
          retention-days: 14
