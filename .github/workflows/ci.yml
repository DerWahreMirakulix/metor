name: CI

on:
  push:
  pull_request:

jobs:
  python-quality:
    name: Python Quality (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Shared Python Quality Checks
        uses: ./.github/actions/python-quality
        with:
          python-version: ${{ matrix.python-version }}
          ruff-check-paths: "src/metor/ scripts/ tests/"
          ruff-format-paths: "src/metor/ scripts/ tests/"
          mypy-paths: "src/metor/ scripts/"
          run-tests: "true"

      - name: Build and validate all wheels
        shell: bash
        run: |
          python -m pip wheel --no-deps --no-build-isolation . -w dist
          python -m pip wheel --no-deps --no-build-isolation packaging/sdk -w dist
          python -m pip wheel --no-deps --no-build-isolation packaging/terminal -w dist
          python -m pip wheel --no-deps --no-build-isolation packaging/gui -w dist
          python scripts/validate_wheel_versions.py dist/*.whl

      - name: Validate Central Version Registry
        run: python scripts/versioning.py validate

      - name: Validate generated references against checked-in copies
        run: python scripts/validate_generated_docs.py

      - name: Build native offline bundles and test installed consumers
        if: matrix.python-version == '3.11'
        shell: bash
        run: |
          python scripts/build_release_wheelhouse.py --variant all --skip-pip-upgrade --output-dir closure-bundles
          python scripts/validate_installed_artifacts.py closure-bundles
          python scripts/validate_release_installers.py closure-bundles

      - name: Run native GUI fixtures outside unittest discovery
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        shell: bash
        env:
          SDL_VIDEODRIVER: offscreen
          KIVY_WINDOW: sdl2
          KIVY_CLIPBOARD: dummy
        run: |
          python tests/gui_native_capture.py --view root_refresh --width 360 --height 640 --font-scale 1.5 --output "${RUNNER_TEMP}/root-refresh.png"
          python tests/gui_native_capture.py --view setting_keyboard --width 360 --height 640 --font-scale 1.5 --output "${RUNNER_TEMP}/setting-keyboard.png"

      - name: Run bounded synthetic stream fixture outside unittest discovery
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        shell: bash
        run: python tests/gui_stream_pressure.py --result "${RUNNER_TEMP}/stream-pressure.json"
