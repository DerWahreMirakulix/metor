[build-system]
requires = ["setuptools==80.10.2", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "metor-ui-gui"
dynamic = ["version", "dependencies"]
description = "Native privacy-first graphical frontend for Metor."
requires-python = ">=3.11"
license = { text = "GPLv3" }

[project.entry-points."metor.ui_frontends"]
gui = "metor.ui.gui.launcher:launch"

[project.gui-scripts]
metor-gui = "metor.main:gui_main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "metor.versioning.APP_VERSION" }

[tool.setuptools.package-dir]
"" = "../../src"

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["metor.ui.gui", "metor.ui.gui.*"]

[tool.setuptools.package-data]
"metor.ui.gui" = ["assets/manifest.json", "assets/fonts/*", "assets/icons/*"]
