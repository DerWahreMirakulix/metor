[build-system]
requires = ["setuptools==80.10.2", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "metor-daemon"
dynamic = ["version", "dependencies"]
description = "Headless Tor messenger daemon and storage runtime for Metor."
authors = [{ name = "LuRex" }]
requires-python = ">=3.11"
license = { text = "GPLv3" }

[project.scripts]
metor-daemon = "metor.daemon_main:main"

[tool.setuptools]
include-package-data = true
py-modules = [
    "metor.daemon_main",
    "metor.versioning",
    "metor.core.key",
    "metor.core.profile_destruction",
    "metor.core.profile_keys",
    "metor.core.tor",
]

[tool.setuptools.dynamic]
version = { attr = "metor.versioning.APP_VERSION" }

[tool.setuptools.package-dir]
"" = "../../src"

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["metor.core.daemon*", "metor.data*", "metor.application*"]
