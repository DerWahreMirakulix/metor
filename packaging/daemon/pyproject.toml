[build-system]
requires = ["setuptools==80.10.2", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "metor-daemon"
version = "0.2.0"
description = "Headless Tor messenger daemon and storage runtime for Metor."
authors = [{ name = "LuRex" }]
requires-python = ">=3.11"
license = { text = "GPLv3" }
dependencies = [
    "metor-sdk>=0.2.0",
    "stem==1.8.2",
    "PySocks==1.7.1",
    "psutil==7.2.2",
    "python-dotenv==1.2.2",
    "sqlcipher3-binary==0.6.0; platform_system == 'Linux'",
    "sqlcipher3==0.6.2; platform_system != 'Linux'",
]

[project.scripts]
metor-daemon = "metor.daemon_main:main"

[tool.setuptools]
include-package-data = true
py-modules = [
    "metor.daemon_main",
    "metor.core.key",
    "metor.core.profile_destruction",
    "metor.core.profile_keys",
    "metor.core.tor",
]

[tool.setuptools.package-dir]
"" = "../../src"

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["metor.core.daemon*", "metor.data*", "metor.application*"]
